<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Gallery | NeuroScan Nepal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <nav class="top-nav">
      <a class="brand" href="index.html">NeuroScan Nepal</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="prototype.html">Prototype</a>
        <a class="active" href="images.html">Image Gallery</a>
      </div>
    </nav>

    <section class="panel" style="margin-top: 10px;">
      <div class="pill">🖼️ MRI image gallery</div>
      <h3>Explore sample scans</h3>
      <p>This page groups your MRI images so the prototype can feel more like a real diagnostic workspace.</p>
      <div class="image-grid">
        <div class="image-card">
          <img src="../Training/notumor/Tr-no_1.jpg" alt="Normal MRI sample 1" />
          <div class="image-label">Normal sample 1</div>
        </div>
        <div class="image-card">
          <img src="../Training/notumor/Tr-no_2.jpg" alt="Normal MRI sample 2" />
          <div class="image-label">Normal sample 2</div>
        </div>
        <div class="image-card">
          <img src="../Training/glioma/Tr-gl_1.jpg" alt="Abnormal MRI sample 1" />
          <div class="image-label abnormal">Abnormal sample 1</div>
        </div>
        <div class="image-card">
          <img src="../Training/glioma/Tr-gl_2.jpg" alt="Abnormal MRI sample 2" />
          <div class="image-label abnormal">Abnormal sample 2</div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
