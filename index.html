<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroScan Nepal Prototype</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7fb;
      color: #223;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    h1 { color: #1f4e79; }
    button {
      background: #1f4e79;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background: #163b5c; }
    .card { margin-top: 20px; padding: 16px; background: #f9fbff; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; text-align: left; }
    .badge { display:inline-block; padding:4px 8px; border-radius: 999px; font-size: 12px; }
    .normal { background: #e8f5e9; color: #2e7d32; }
    .abnormal { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <div class="container">
    <h1>NeuroScan Nepal Prototype</h1>
    <p>This page runs the 100-patient demo in the browser.</p>
    <button onclick="loadPrototype()">Generate Prototype Data</button>

    <div class="card">
      <h3>Summary</h3>
      <div id="summary">No data generated yet.</div>
    </div>

    <div class="card">
      <h3>Patient Results</h3>
      <table>
        <thead>
          <tr><th>Patient ID</th><th>Status</th><th>Confidence</th></tr>
        </thead>
        <tbody id="patient-table"></tbody>
      </table>
    </div>
  </div>

  <script>
    function loadPrototype() {
      const patients = [];
      const rng = (() => {
        let seed = 42;
        return () => {
          seed = (seed * 1664525 + 1013904223) % 4294967296;
          return seed / 4294967296;
        };
      })();

      for (let i = 0; i < 100; i++) {
        const isAbnormal = i < 40;
        const confidence = isAbnormal
          ? 0.78 + rng() * 0.19
          : 0.82 + rng() * 0.17;
        patients.push({
          patientId: `P${String(i + 1).padStart(3, '0')}`,
          status: isAbnormal ? 'abnormal' : 'normal',
          confidence: confidence.toFixed(4)
        });
      }

      const normalCount = patients.filter(p => p.status === 'normal').length;
      const abnormalCount = patients.filter(p => p.status === 'abnormal').length;

      document.getElementById('summary').innerHTML = `
        <strong>Patient count:</strong> ${patients.length}<br>
        <strong>Normal:</strong> ${normalCount}<br>
        <strong>Abnormal:</strong> ${abnormalCount}<br>
        <strong>Mode:</strong> Browser-based prototype demo
      `;

      const tableBody = document.getElementById('patient-table');
      tableBody.innerHTML = '';
      patients.slice(0, 20).forEach(patient => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${patient.patientId}</td>
          <td><span class="badge ${patient.status}">${patient.status}</span></td>
          <td>${patient.confidence}</td>
        `;
        tableBody.appendChild(row);
      });
    }
  </script>
</body>
</html>
